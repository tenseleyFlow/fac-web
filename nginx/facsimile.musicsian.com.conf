server {
    server_name facsimile.musicsian.com;
    root  /var/www/facsimile.musicsian.com/current;
    index index.html;

    access_log /var/log/nginx/facsimile.access.log;
    error_log  /var/log/nginx/facsimile.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets (JS, CSS, fonts, images)
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Cache release files but allow revalidation
    location /releases/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";

        # Force download of binary files
        if ($request_uri ~* \.(tar\.gz|zip|dmg|rpm|deb|pkg)$) {
            add_header Content-Disposition 'attachment';
        }
    }

    # Gzip compression for text-based files
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Handle SPA routing (fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}
